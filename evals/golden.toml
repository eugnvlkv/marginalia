kind = "factual"
question = "В карточке вход «Ретест»: мол, пробитый уровень теперь перевёрнут. Почему старое сопротивление после пробоя вдруг начинает работать как поддержка?"
relevant = [
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › SUPPORT AND RESISTANCE › How Support and Resistance Levels Reverse Their Roles" },
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › SUPPORT AND RESISTANCE › The Psychology of Support and Resistance" },
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › SUPPORT AND RESISTANCE › Support Becoming Resistance and Vice Versa: Degree of Penetration" },
]
expected = """
Когда уровень поддержки или сопротивления пробит на значительную величину, они меняются ролями: сопротивление становится поддержкой, поддержка — сопротивлением.
Причина — психология участников (лонги, шорты, вне рынка): у каждой группы есть «интерес» к зоне, где шла торговля; после пробоя ошибившиеся хотят выйти или войти на возврате к ней, и прежние продажи у сопротивления превращаются в покупки под рынком (а прежние покупки у поддержки — в продажи над рынком).
Чем значимее была зона (дольше там торговали, больше объём, свежее), тем сильнее она действует в новой роли.
Роли меняются только после значительного пробоя — когда рынок ушёл достаточно далеко, чтобы участники убедились в ошибке; ориентир около 3% для крупных уровней и около 1% для краткосрочных, но это субъективно.
"""
