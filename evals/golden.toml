[[questions]]
id = "q02-adx-vs-atr"
kind = "multi"
question = "Вечно путаю ADX и ATR, оба вроде про «силу движения». Если ADX ниже 20, а ATR при этом большой, это тренд или нет?"
relevant = [
    { book = "murphy-ta", path = "15 Computers and Trading Systems › WELLES WILDER’S PARABOLIC AND DIRECTIONAL MOVEMENT SYSTEMS › DMI and ADX" },
    { book = "murphy-ta", path = "A Advanced Technical Indicators › STARC BANDS AND KELTNER CHANNELS" },
]
expected = """
ADX (Уайлдер, часть системы DMI) оценивает степень направленного движения по шкале 0–100: растущий ADX — рынок в тренде, падающий — бестрендовая среда; само направление показывают линии +DI и −DI.
Разворот ADX вверх и подъём выше 20 часто означает начало нового тренда; разворот вниз от уровня выше 40 — ранний признак ослабления тренда и начала торгового диапазона.
ATR (Average True Range) — среднее значение «истинного диапазона» баров за x периодов, т.е. размах движения цены, а не его направленность; на ATR строятся полосы STARC и каналы Кельтнера.
Книга эту комбинацию прямо не разбирает; из определений: ADX ниже 20 — тренда нет, даже если бары широкие (большой ATR); для бестрендового рынка книга советует осцилляторы, а не трендовые системы.
"""
reviewed = true
# evidence: 15 Computers and Trading Systems › WELLES WILDER’S PARABOLIC AND DIRECTIONAL MOVEMENT SYSTEMS › DMI and ADX — "Wilder’s ADX line rates the directional movement of the various markets on a scale of 0 to 100. A rising ADX line means the market is trending"
# evidence: A Advanced Technical Indicators › STARC BANDS AND KELTNER CHANNELS — "Average True Range is the average of true price ranges over x periods."
# source: frontend/src/locales/ru.ts:692 — подсказка ADX: сила тренда, а не направление (ta.metric.adx.tip)
# theme: тренд и фазы
# note: ADX 20-level quote from the same section: "A rise back above the 20 level is often a sign of the start of a new trend." The book never says explicitly "ATR measures volatility" (Keltner: close above band "indicates a breakout in upward volatility"); the ADX<20 + big ATR verdict is a synthesis, not a quote. Could be argued as partial if the reviewer wants the combination to be "not in the book".
# review (independent trader review, 2026-10-31): ok, confidence medium — Определения ADX/DI и ATR совпадают с текстом гл. 15 и прил. A; вывод «ниже 20 — бестрендовая среда» опирается на рис. 15.5, 15.7 и 15.8 (разворот вверх от уровня ниже 20 = конец торгового диапазона). Ответ собран из двух разделов, поэтому тип multi верен.

