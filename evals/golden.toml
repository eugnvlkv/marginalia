[[questions]]
id = "q61-gaps-fill"
kind = "factual"
question = "Говорят, гэпы всегда закрываются. Это правда? Какие гэпы обычно закрываются, а какие нет?"
relevant = [
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › PRICE GAPS" },
]
expected = """
Нет: «гэпы всегда закрываются» — миф; одни должны закрываться, другие нет, смысл зависит от типа гэпа и места в тренде.
Гэп прорыва (breakaway) — на завершении важной фигуры, обычно на большом объёме; чаще всего не закрывается (может закрыться частично); чем больше объём после гэпа, тем меньше шанс закрытия.
Гэп продолжения (runaway/measuring) — около середины движения, на умеренном объёме; служит поддержкой на коррекциях и тоже часто не закрывается.
Гэп истощения (exhaustion) — в конце движения: рывок быстро гаснет, цены разворачиваются за несколько дней/неделю; закрытие ниже этого гэпа — медвежий сигнал (с гэпом вниз даёт «остров»).
В аптренде закрытие ниже восходящего гэпа — всегда признак слабости.
"""
reviewed = true
# evidence: 4 Basic Concepts of Trend › PRICE GAPS — "One of the maxims often heard is that “gaps are always filled.” This is simply not true. Some should be filled and others shouldn’t."
# evidence: 4 Basic Concepts of Trend › PRICE GAPS — "More often than not, breakaway gaps are not filled." (subsection Three Types of Gaps, covered by the parent)
# source: форумы трейдеров (BabyPips, Elite Trader, Quora): типичное недоумение, вопрос сформулирован ассистентом
# theme: гэпы
# note: parent chosen because the "myth" sentence is in the parent's own text and the per-type answer is in Three Types of Gaps / The Island Reversal. The book never says outright "exhaustion gaps get filled"; it says prices turn lower and close under the gap. 16 › TRADING TACTICS › Using Price Gaps (gaps as support for entries) does not address filling.
# review (independent trader review, 2026-10-31): ok, confidence high — Тезисы точно передают раздел Price Gaps: миф про «всегда закрываются», breakaway и runaway часто не закрываются, закрытие ниже exhaustion-гэпа — сигнал вершины, закрытие ниже восходящего гэпа — слабость. Тип factual верен.

