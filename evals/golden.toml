[[questions]]
id = "q64-dow-three-trends"
kind = "multi"
question = "Что такое основной, вторичный и малый тренд по теории Доу? Как понять, что откат — это вторичный тренд, а не разворот основного?"
relevant = [
    { book = "murphy-ta", path = "2 Dow Theory › BASIC TENETS › 2. The Market Has Three Trends." },
    { book = "murphy-ta", path = "2 Dow Theory › BASIC TENETS › 6. A Trend Is Assumed to Be in Effect Until It Gives Definite Signals That It Has Reversed." },
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › PERCENTAGE RETRACEMENTS" },
    { book = "murphy-ta", path = "4 Basic Concepts of Trend › TREND HAS THREE CLASSIFICATIONS" },
]
expected = """
По Доу у тренда три части — основной (прилив, больше года, возможно несколько лет), вторичный/промежуточный (волны, от трёх недель до трёх месяцев) и малый (рябь, обычно меньше трёх недель); каждый тренд — часть следующего, большего.
Вторичный тренд — коррекция основного: обычно откатывает от 1/3 до 2/3 предыдущего движения, чаще всего около 50%; во время такой коррекции основной тренд остаётся восходящим, хотя промежуточный и краткосрочный идут вниз.
Отличить нормальную вторичную коррекцию от первой волны нового тренда — самая трудная задача; сигнал разворота — более низкие вершины и впадины: при «failure swing» (рост C не превысил пик A, затем пробит минимум B) сигнал однозначен, при «nonfailure swing» часть доутеоретиков ждёт ещё один более низкий максимум и минимум.
Тренд считается действующим, пока не даст явных сигналов разворота; шансы обычно за продолжение тренда.
Если коррекция уходит дальше 2/3 (66%) предыдущего движения, шансы уже за разворот тренда, а не просто откат.
"""
reviewed = true
# evidence: 2 Dow Theory › BASIC TENETS › 2. The Market Has Three Trends. — "The secondary, or intermediate, trend represents corrections in the primary trend and usually lasts three weeks to three months."
# evidence: 2 Dow Theory › BASIC TENETS › 6. A Trend Is Assumed to Be in Effect Until It Gives Definite Signals That It Has Reversed. — "being able to distinguish between a normal secondary correction in an existing trend and the first leg of a new trend in the opposite direction."
# evidence: 4 Basic Concepts of Trend › PERCENTAGE RETRACEMENTS — "If prices move beyond the two-thirds point, the odds then favor a trend reversal rather than just a retracement."
# source: форумы трейдеров (BabyPips, Elite Trader, Quora): типичное недоумение, вопрос сформулирован ассистентом
# theme: теория Доу
# note: PERCENTAGE RETRACEMENTS is in ch.4 but explicitly says the 33/50/66% parameters "are taken right from the original Dow Theory". Optional extras not listed: 4 › TREND HAS THREE CLASSIFICATIONS (restates the three trends; Murphy shortens major trend to >6 months for futures) and 2 › THE USE OF CLOSING PRICES AND THE PRESENCE OF LINES (Dow used closes only).
# review (independent trader review, 2026-10-31): fix, confidence medium — Пропущен раздел Trend Has Three Classifications, где Мерфи разбирает классификацию Доу и показывает на примере (рис. 4.2a), что промежуточный тренд — коррекция основного: во время отката основной тренд всё ещё восходящий. Тезисы сжаты до 5 строк, факты прежние.
