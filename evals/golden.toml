Перепроданность — это просто экстремальное значение: RSI ниже 30 (в медвежьем рынке уровнем перепроданности часто становится 20); это лишь предупреждение, а не сигнал.
Дивергенция — это расхождение с ценой: цена обновляет минимум, а RSI при повторном заходе в зону ниже 30 его не подтверждает (второй минимум RSI выше первого); подтверждается, когда RSI пробивает свой предыдущий пик (bottom failure swing).
