# Golden set: questions with known right answers. Everything in week 3 is measured on it.
#
# Fields of one question:
#   id        unique short name, latin, with dashes
#   kind      "factual"       — the answer is in one place
#             "multi"         — the answer is assembled from several sections (at least 2 in `relevant`)
#             "partial"       — part of the question is in the books, part is not
#                               (e.g. "why 0.618 retracement, and does it work in crypto?").
#                               A correct answer gives the book part and honestly says the rest is not in the books.
#             "unanswerable"  — the books do not answer it; `relevant` stays empty
#   question  as a crypto-analyst user would ask it (any language)
#   relevant  sections that answer it: { book = "...", path = "Chapter › Section" }.
#             A section also covers its subsections.
#             Find exact paths with:  uv run python -m marginalia.golden sections <word>
#   expected  key points a correct answer must contain (the LLM judge compares against them).
#             For "partial": the book part AND which part must be refused.
#             For "unanswerable": what a correct refusal looks like.
#
# Check the file:  uv run python -m marginalia.golden check
# Goal for the week: ~40 questions across all four kinds.

