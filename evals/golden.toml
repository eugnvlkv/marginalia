# evidence: 5 Major Reversal Patterns › VARIATIONS FROM THE IDEAL PATTERN › Time Between Peaks or Troughs Is Important — "In general, most valid double tops or bottoms should have at least a month between the two peaks or troughs."
# source: форумы трейдеров (BabyPips, Elite Trader, Quora): типичное недоумение, вопрос сформулирован ассистентом
