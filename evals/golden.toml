[[questions]]
id = "q63-double-top-confirmation"
kind = "multi"
question = "Две вершины примерно на одном уровне — это уже двойная вершина или надо ждать пробоя минимума между ними? Как не зашортить раньше времени?"
relevant = [
    { book = "murphy-ta", path = "5 Major Reversal Patterns › DOUBLE TOPS AND BOTTOMS" },
    { book = "murphy-ta", path = "5 Major Reversal Patterns › VARIATIONS FROM THE IDEAL PATTERN › The Term “Double Top” Greatly Overused" },
    { book = "murphy-ta", path = "5 Major Reversal Patterns › VARIATIONS FROM THE IDEAL PATTERN › Time Between Peaks or Troughs Is Important" },
    { book = "murphy-ta", path = "5 Major Reversal Patterns › VARIATIONS FROM THE IDEAL PATTERN" },
    { book = "murphy-ta", path = "5 Major Reversal Patterns › VARIATIONS FROM THE IDEAL PATTERN › Filters" },
]
expected = """
Две вершины — лишь «потенциальная» двойная вершина: разворот не завершён, пока промежуточный минимум между ними не пробит на закрытии; до этого это может быть боковая консолидация перед продолжением аптренда.
Фигуру завершает решительное закрытие ниже промежуточного минимума на возросшем объёме (на второй вершине объём обычно меньше); возврат к уровню пробоя — обычное дело.
Термин сильно злоупотребляют: откат от прежнего пика — нормальная реакция, большинство потенциальных двойных вершин оказываются чем-то другим; шансы обычно за продолжение тренда, поэтому разумно ждать завершения фигуры.
Вершины не обязаны совпадать точно: вторая может не дотянуть до первой (не проблема) или чуть превысить её и всё равно оказаться частью вершины («ловушка быков»); ложные сигналы уменьшают фильтры — закрытие, а не внутридневной прокол, ценовой фильтр 1–3%, правило двух дней (не безошибочны).
У большинства валидных двойных вершин между пиками не меньше месяца (иногда 2–3 месяца); чем больше время между пиками и высота фигуры, тем значимее разворот.
"""
reviewed = true
# evidence: 5 Major Reversal Patterns › DOUBLE TOPS AND BOTTOMS — "the reversal is not complete until the previous support point at B is violated on a closing basis."
