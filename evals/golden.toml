[[questions]]
id = "q66-obv-divergence"
kind = "factual"
question = "OBV растёт, а цена стоит на месте или даже падает — что это значит? Как вообще читать OBV?"
relevant = [
    { book = "murphy-ta", path = "7 Volume and Open Interest › INTERPRETATION OF VOLUME FOR ALL MARKETS" },
]
expected = """
OBV — накопительная линия: объём дня прибавляется, если день закрылся выше, и вычитается, если ниже; важно направление (тренд) линии, а не её абсолютные значения.
В норме OBV идёт в ту же сторону, что и цена (в аптренде — более высокие пики и впадины); если линия объёма не идёт вслед за ценой, это дивергенция, предупреждающая о возможном развороте.
«Объём опережает цену»: ослабление/усиление давления видно в объёме раньше, чем в цене; растущий OBV при стоящей или падающей цене — объём преобладает на росте, бычье расхождение (в книге пример, где OBV вёл цену вверх и заранее предупредил о бычьем пробое).
Ограничения: весь дневной объём получает знак даже при минимальном изменении закрытия; на фьючерсах объём публикуется с опозданием на день, а «лимитные» дни искажают OBV.
"""
reviewed = true
# evidence: 7 Volume and Open Interest › INTERPRETATION OF VOLUME FOR ALL MARKETS — "It’s when the volume line fails to move in the same direction as prices that a divergence exists and warns of a possible trend reversal." (subsection On Balance Volume)
# evidence: 7 Volume and Open Interest › INTERPRETATION OF VOLUME FOR ALL MARKETS — "This chart of McDonalds shows the OBV line leading the price higher and warning in advance of the bullish breakout." (Figure 7.8 caption, sits in subsection Other Volume Limitations in Futures)
# source: форумы трейдеров (BabyPips, Elite Trader, Quora): типичное недоумение, вопрос сформулирован ассистентом
# theme: объём: OBV
# note: parent chosen because the answer spans On Balance Volume, Volume Precedes Price, Alternatives to OBV and the Fig 7.8 caption in Other Volume Limitations in Futures. Narrower alternative: On Balance Volume + Volume Precedes Price (kind -> multi). The book never literally describes "OBV up while price falls"; the reading comes from the general divergence rule plus Fig 7.8.
# review (independent trader review, 2026-10-31): ok, confidence high — Тезисы подтверждаются разделом Interpretation of Volume for All Markets: построение OBV, важно направление линии, дивергенция, «объём опережает цену», рис. 7.8 с OBV, ведущим цену вверх, ограничения OBV и фьючерсного объёма. Тип factual верен.

