[[questions]]
id = "q65-elliott-hard-rules"
kind = "multi"
question = "Волны Эллиотта каждый считает по-своему. Какие там жёсткие правила подсчёта, которые нельзя нарушать?"
relevant = [
    { book = "murphy-ta", path = "13 Elliott Wave Theory › BASIC TENETS OF THE ELLIOTT WAVE PRINCIPLE" },
    { book = "murphy-ta", path = "13 Elliott Wave Theory › CORRECTIVE WAVES" },
    { book = "murphy-ta", path = "13 Elliott Wave Theory › ELLIOTT WAVE APPLIED TO STOCKS VERSUS COMMODITIES" },
    { book = "murphy-ta", path = "13 Elliott Wave Theory › SUMMARY AND CONCLUSIONS" },
    { book = "murphy-ta", path = "13 Elliott Wave Theory › THE RULE OF ALTERNATION" },
    { book = "murphy-ta", path = "13 Elliott Wave Theory › WAVE 4 AS A SUPPORT AREA" },
]
expected = """
Основа счёта: пять волн по тренду (1, 3, 5 — импульсные, 2 и 4 — коррекционные) и три волны коррекции a-b-c; делится ли волна на пять или на три, определяет направление волны следующего, старшего уровня.
Одно из важнейших правил: коррекция никогда не идёт пятью волнами (коррекции — «тройки», исключение — треугольники); пятиволновое движение против тренда — скорее первая волна более крупного движения.
«Нерушимое» правило: волна 4 никогда не перекрывает волну 1 — в акциях; на товарных фьючерсах оно не так строго (возможны внутридневные проколы).
Остальное книга подаёт как ориентиры, а не жёсткие правила: чередование говорит лишь, чего «вероятно» не будет; медвежий рынок «обычно» не уходит ниже предыдущей 4-й волны (исключения есть); растяжение одной импульсной волны, соотношения Фибоначчи; неясную картину нельзя насильно втискивать в счёт Эллиотта — использовать вместе с другими инструментами.
Правил вроде «волна 3 не может быть самой короткой» в книге нет — не приписывать их книге.
"""
