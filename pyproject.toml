[project]
name = "marginalia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eugene Volkov", email = "evgeniiv@vaiz.com" }
]
requires-python = ">=3.12"
dependencies = [
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
]

[project.scripts]
marginalia = "marginalia:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
